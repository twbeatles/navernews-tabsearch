name: Build and publish signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: QtNetwork and entrypoint import smoke
        run: python -c "from PySide6 import QtNetwork; import news_scraper_pro"

      - name: Verify tag and application version agree
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $appVersion = python -c "from core.constants import VERSION; print(VERSION)"
          if ($tagVersion -ne $appVersion) { throw "Tag v$tagVersion does not match VERSION $appVersion" }

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean news_scraper_pro.spec

      - name: Create GitHub Release and upload executable
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NewsScraperPro_Safe.exe
          generate_release_notes: true

      - name: Generate signed update manifest
        shell: pwsh
        env:
          NEWS_SCRAPER_UPDATE_PRIVATE_KEY_B64: ${{ secrets.NEWS_SCRAPER_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NewsScraperPro_Safe.exe"
          python scripts/build_update_manifest.py --version $version --artifact dist/NewsScraperPro_Safe.exe --artifact-url $url --output updates/latest.json

      - name: Publish signed manifest to main
        shell: pwsh
        run: |
          Copy-Item updates/latest.json $env:RUNNER_TEMP/latest.json
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item $env:RUNNER_TEMP/latest.json updates/latest.json
          git add updates/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if (git diff --cached --quiet) { Write-Host "manifest already up to date"; exit 0 }
          git commit -m "chore: publish update manifest for ${{ github.ref_name }}"
          git push origin main
