name: Windows quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install verified dependencies
        run: python -m pip install -r requirements-build.txt
      - name: QtNetwork and entrypoint import smoke
        run: python -c "from PySide6 import QtNetwork; import news_scraper_pro"
      - name: Static analysis
        run: python -m pyright
      - name: Test suite
        run: python -m pytest -q
